<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06c755" />
    <title>Warikan</title>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1 class="title" data-i18n="appTitle"></h1>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="ja">JP</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </header>

      <div class="field">
        <label class="label" for="total" data-i18n="totalLabel"></label>
        <div class="input-wrap">
          <input
            id="total"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            class="input"
          />
          <span class="suffix" data-i18n="yen"></span>
        </div>
      </div>

      <div class="field">
        <label class="label" for="people" data-i18n="peopleLabel"></label>
        <div class="input-wrap">
          <input
            id="people"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            class="input"
          />
          <span class="suffix" data-i18n="people"></span>
        </div>
      </div>

      <div class="result">
        <span class="result-label" data-i18n="perPersonLabel"></span>
        <span class="result-value" id="result">—</span>
      </div>

      <button type="button" class="share-btn" id="share" disabled data-i18n="shareButton"></button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
